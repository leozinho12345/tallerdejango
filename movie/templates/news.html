<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Noticias - Movies App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">MoviesApp</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Películas</a>
        <a class="nav-link active" href="/news/">Noticias</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="mb-4">Últimas Noticias</h1>

    {% for item in newss %}
    <div class="card mb-3 shadow-sm">
      <div class="row g-0 align-items-center">
        <div class="col-md-3 bg-dark text-white text-center py-4 rounded-start">
          <h5 class="m-0">{{ item.date }}</h5>
        </div>
        <div class="col-md-9">
          <div class="card-body">
            <h5 class="card-title">{{ item.headline }}</h5>
            <p class="card-text">{{ item.body }}</p>
          </div>
        </div>
      </div>
    </div>
    {% empty %}
    <div class="alert alert-info">No hay noticias registradas.</div>
    {% endfor %}
  </div>

</body>
</html>
