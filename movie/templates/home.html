<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar con imagen estática -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="/media/movie/images/unnamed.webp" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
        MoviesApp
      </a>
    </div>
  </nav>

  <div class="container">
    <h1 class="mb-4">Lista de Películas</h1>

    <!-- Formulario de Búsqueda -->
    <form action="" method="GET" class="mb-4">
      <div class="input-group">
        <input type="text" name="searchMovie" class="form-control" placeholder="Buscar película..." value="{{ searchTerm|default:'' }}">
        <button class="btn btn-primary" type="submit">Buscar</button>
      </div>
    </form>

    <!-- Cards de Películas -->
    <div class="row">
      {% for movie in movies %}
      <div class="col-12 col-md-6 col-lg-4 mb-4">
        <div class="card h-100 shadow-sm">
          {% if movie.image %}
            <img src="/media/{{ movie.image }}" class="card-img-top" alt="{{ movie.title }}" style="height: 250px; object-fit: cover;">
          {% endif %}
          <div class="card-body">
            <h5 class="card-title">{{ movie.title }}</h5>
            <p class="card-text text-muted">{{ movie.description }}</p>
            <p class="card-text mb-1"><strong>Género:</strong> {{ movie.genre }}</p>
            <p class="card-text"><strong>Año:</strong> {{ movie.year }}</p>
          </div>
        </div>
      </div>
      {% empty %}
      <p>No se encontraron películas.</p>
      {% endfor %}
    </div>
  </div>

</body>
</html>
